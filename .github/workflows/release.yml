name: release

# 推送 v* 标签发布 Release；手动触发只产出构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win --x64 }     # x64
          - { os: macos-latest,   args: --mac --arm64 }   # Apple Silicon
          # 需要 Intel Mac 版时取消注释：
          # - { os: macos-15-intel, args: --mac --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 标签发版时把 vX.Y.Z 写进 package.json；--allow-same-version 允许版本未变。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --allow-same-version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Stage dsh runtime
        run: node stage-dsh.mjs
        # 锁定 dsh 版本：env DSH_VERSION: <版本>

      - name: Install desktop shell deps
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      # latest.yml 是应用内更新的元数据，随安装包一起发布。
      # NSIS 差分已关闭（nsis.differentialPackage=false），更新整包下载，不产出 .exe.blockmap。
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            DeepSeek Harness 非官方桌面版。上游：https://github.com/deepseek-ai/deepseek-harness

            安装包只含官方 dsh；插件在 dsh 界面的「插件」页安装，推荐清单见 README。

            Windows 版支持应用内更新：帮助 → 检查应用更新，后台下载后重启即完成安装（`latest.yml` 为更新元数据）。

            安装包未签名：
            - Windows：SmartScreen 提示时点「更多信息 → 仍要运行」。
            - macOS：提示无法打开时执行 `xattr -cr "/Applications/DeepSeek Harness.app"`。
