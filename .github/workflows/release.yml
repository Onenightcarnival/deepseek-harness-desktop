name: release

# 桌面安装包构建：推送 v* 标签自动出 Release，
# 也可以在 Actions 页面手动触发（只出构建产物，不发 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 两个 flavor：minimal（极简，plugins.json）与 full（预置
      # @linxin666/dsh-web-ui-all 全家桶，plugins-full.json，产物名带 -full）。
      matrix:
        include:
          - { os: windows-latest, args: --win --x64,   flavor: minimal }   # x64
          - { os: windows-latest, args: --win --x64,   flavor: full }
          - { os: macos-latest,   args: --mac --arm64, flavor: minimal }   # Apple Silicon
          - { os: macos-latest,   args: --mac --arm64, flavor: full }
          # 需要 Intel Mac 版时取消注释：
          # - { os: macos-15-intel, args: --mac --x64, flavor: minimal }
          # - { os: macos-15-intel, args: --mac --x64, flavor: full }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 标签发版时以标签为唯一版本源：把 vX.Y.Z 写进 package.json，
      # 产物文件名与应用内版本号自动一致，无需手动改文件。
      # --allow-same-version：package.json 已是该版本时 npm version 会以
      # "Version not changed" 报错退出，加此参数视为成功。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --allow-same-version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Stage dsh runtime
        run: node stage-dsh.mjs
        env:
          DSH_FLAVOR: ${{ matrix.flavor }}
        # 想锁定 dsh 版本时再加： DSH_VERSION: 0.1.0-rc.6

      - name: Install desktop shell deps
        run: npm install --no-audit --no-fund

      # full flavor 通过命令行覆盖产物名加 -full 后缀，其余配置共用。
      - name: Build installer
        shell: bash
        run: |
          EXTRA=()
          if [ "${{ matrix.flavor }}" = "full" ]; then
            EXTRA+=('-c.nsis.artifactName=DeepSeek-Harness-Setup-${version}-win-${arch}-full.${ext}')
            EXTRA+=('-c.mac.artifactName=DeepSeek-Harness-${version}-mac-${arch}-full.${ext}')
          fi
          npx electron-builder ${{ matrix.args }} --publish never "${EXTRA[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.flavor }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            非官方桌面版（Electron 壳 + npm 发布版 `@deepseek-ai/dsh`）。
            上游项目：https://github.com/deepseek-ai/deepseek-harness

            每个平台两种安装包：
            - 常规版：只含官方 dsh，插件自装。
            - 文件名带 `-full`：额外预置四个生产力插件——任务看板、Git 图谱、
              SSH 远程连接（dsh-web-ui）与侧边栏增强 dsh-better-sidebar。

            安装包未做代码签名：
            - Windows 首次运行如弹出 SmartScreen，点「更多信息 → 仍要运行」。
            - macOS 首次打开如提示「无法打开/已损坏」，先执行
              `xattr -cr "/Applications/DeepSeek Harness.app"` 再打开。
