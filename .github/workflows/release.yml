name: release

# 推送 v* 标签发布 Release；手动触发只产出构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # flavor：minimal（plugins.json）与 full（plugins-full.json，产物名带 -full）。
      matrix:
        include:
          - { os: windows-latest, args: --win --x64,   flavor: minimal }   # x64
          - { os: windows-latest, args: --win --x64,   flavor: full }
          - { os: macos-latest,   args: --mac --arm64, flavor: minimal }   # Apple Silicon
          - { os: macos-latest,   args: --mac --arm64, flavor: full }
          # 需要 Intel Mac 版时取消注释：
          # - { os: macos-15-intel, args: --mac --x64, flavor: minimal }
          # - { os: macos-15-intel, args: --mac --x64, flavor: full }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 标签发版时把 vX.Y.Z 写进 package.json；--allow-same-version 允许版本未变。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --allow-same-version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Stage dsh runtime
        run: node stage-dsh.mjs
        env:
          DSH_FLAVOR: ${{ matrix.flavor }}
        # 锁定 dsh 版本：DSH_VERSION: <版本>

      - name: Install desktop shell deps
        run: npm install --no-audit --no-fund

      # full flavor：产物名加 -full 后缀，更新信息走 full 频道（full.yml），
      # 包内 package.json 记 flavor=full 供应用内更新选频道。minimal 用默认的 latest.yml。
      - name: Build installer
        shell: bash
        run: |
          EXTRA=()
          if [ "${{ matrix.flavor }}" = "full" ]; then
            EXTRA+=('-c.nsis.artifactName=DeepSeek-Harness-Setup-${version}-win-${arch}-full.${ext}')
            EXTRA+=('-c.mac.artifactName=DeepSeek-Harness-${version}-mac-${arch}-full.${ext}')
            EXTRA+=('-c.extraMetadata.flavor=full')
            EXTRA+=('-c.publish.channel=full')
          fi
          npx electron-builder ${{ matrix.args }} --publish never "${EXTRA[@]}"

      # *.yml（latest.yml / full.yml）与 *.blockmap 是应用内更新的元数据与差分索引，随安装包一起发布。
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.flavor }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            DeepSeek Harness 非官方桌面版。上游：https://github.com/deepseek-ai/deepseek-harness

            每个平台两种安装包：
            - 常规版：只含官方 dsh。
            - `-full`：预置任务看板、SSH 远程连接与 dsh-better-sidebar 工作台。

            Windows 版支持应用内更新：帮助 → 检查应用更新，后台下载后重启即完成安装（`latest.yml` / `full.yml` 与 `.blockmap` 为更新元数据）。

            安装包未签名：
            - Windows：SmartScreen 提示时点「更多信息 → 仍要运行」。
            - macOS：提示无法打开时执行 `xattr -cr "/Applications/DeepSeek Harness.app"`。
