name: release

# 桌面安装包构建：推送 v* 标签自动出 Release，
# 也可以在 Actions 页面手动触发（只出构建产物，不发 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest          # x64
            args: --win --x64
          - os: macos-latest            # Apple Silicon (arm64)
            args: --mac --arm64
          # 需要 Intel Mac 版时取消注释：
          # - os: macos-15-intel
          #   args: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage dsh runtime
        run: node stage-dsh.mjs
        # 想锁定 dsh 版本时： env: { DSH_VERSION: 0.1.0-rc.6 }

      - name: Install desktop shell deps
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            非官方桌面版（Electron 壳 + npm 发布版 `@deepseek-ai/dsh`）。
            上游项目：https://github.com/deepseek-ai/deepseek-harness

            安装包未做代码签名：
            - Windows 首次运行如弹出 SmartScreen，点「更多信息 → 仍要运行」。
            - macOS 首次打开如提示「无法打开/已损坏」，先执行
              `xattr -cr "/Applications/DeepSeek Harness.app"` 再打开。
