# 桌面版的插件组合覆盖层（cordis patch overlay）。
# 启动时经 `dsh web --patch` 应用到 web 配置树，
# 语法与 ~/.dsh/profiles/web/cordis.patch.yml 相同。
#
# 禁用内置插件（id 由 `npx @deepseek-ai/dsh web --dump-config` 查看）：
#   - id: session-title-llm
#     disabled: true
#
# 覆盖插件配置（按 id 定位，config 逐键合并）：
#   - id: tool-web
#     config:
#       someKey: someValue
#
# 挂载额外插件（包须列入 plugins.json 的 packages 随包分发；
# 双面插件须同时挂载 host 与 client-ui 两半）：
#   - insert:
#       - id: web-search-exa
#         name: '@deepseek-ai/dsh-web-search-exa'
#         config:
#           apiKeyEnv: EXA_API_KEY
#
# 空列表：沿用官方默认组合。
[]
