<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title data-i18n="配置中心">配置中心</title>
<link rel="stylesheet" href="desktop.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; display: flex; background: var(--desktop-sidebar); color: var(--desktop-text); font-size: 13px; }

  /* ---- left nav ---- */
  #nav { width: 200px; flex: none; background: transparent;
         padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
  #nav .nav-title { color: var(--desktop-text); font-size: 17px; font-weight: 600; padding: 4px 12px 22px; }
  #nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
                background: none; border: none; color: var(--secondary); padding: 12px; border-radius: 10px;
                cursor: pointer; font-size: 14px; }
  #nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nav button:hover { background: var(--hover); }
  #nav button.active { background: var(--selected); color: var(--desktop-text); }
  #nav .icon { width: 20px; height: 20px; flex: none; }
  #nav .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- panes ---- */
  #content { flex: 1; min-width: 0; overflow: hidden; display: flex; background: var(--desktop-content); border-radius: 16px 0 0 0; }
  .pane { display: none; flex: 1; min-width: 0; }
  .pane.active { display: flex; }
  .single { flex-direction: column; padding: 28px; overflow: auto; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 14px; }

  /* ---- shared controls ---- */
  input, select, textarea { background: var(--control); color: var(--desktop-text); border: 1px solid var(--border);
                  border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none; width: 100%; }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; box-sizing: border-box; }
  input:focus, textarea:focus { border-color: #4d6bfe; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--border); padding: 1px 5px; border-radius: 4px; }
  button { background: var(--border); color: var(--desktop-text); border: 1px solid var(--border); border-radius: 8px;
           padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:hover { background: var(--hover); }
  button.primary { background: #4d6bfe; border-color: #4d6bfe; color: #fff; }
  button.primary:hover { background: #5d79ff; }
  button.danger { background: none; border-color: var(--danger-border); color: var(--danger); }
  button.ghost { background: none; border: none; color: var(--muted); padding: 4px 8px; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .msg { color: var(--muted); font-size: 12px; line-height: 1.6; min-height: 18px; margin-top: 10px; white-space: pre-wrap; }
  .msg.ok { color: var(--success); } .msg.err { color: var(--danger); }

  /* ---- cards & lists ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; }
  .item-row:hover { background: var(--hover); }
  .item-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row .tag { margin-left: 8px; font-size: 11px; color: var(--muted); background: var(--control); border-radius: 4px; padding: 1px 6px; }
  .meta { color: var(--muted); font-size: 11.5px; }
  .tag { color: var(--link); background: var(--badge); border-radius: 5px; font-size: 10.5px; padding: 2px 6px; }

  /* ---- toggle ---- */
  .toggle { position: relative; width: 34px; height: 19px; flex: none; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
  .toggle input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 3px; }
  .toggle .knob { position: absolute; inset: 0; background: var(--switch); border-radius: 10px; transition: background .15s; }
  .toggle .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
                         background: #fff; border-radius: 50%; transition: left .15s; }
  .toggle input:checked + .knob { background: #4d6bfe; }
  .toggle input:checked + .knob::after { left: 17px; }

  /* ---- 通用页的行 ---- */
  .g-rows { display: flex; flex-direction: column; }
  .g-row { display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .g-row:last-child { border-bottom: none; padding-bottom: 2px; }
  .g-row .g-text { flex: 1; min-width: 0; }
  .g-row .g-label { color: var(--desktop-text); font-size: 13px; }
  .g-row.off { opacity: .55; }
  .cs-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; min-width: 0; }
  .cs-card-title { color: var(--desktop-text); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cs-card > .meta { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .cs-card .field:last-child { margin-bottom: 0; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }

  .log { background: var(--desktop-content); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
         height: 170px; overflow: auto; white-space: pre-wrap;
         font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .radio-row { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; color: var(--desktop-text); font-size: 13px; }
  .radio-row input { width: auto; }
  .dim { opacity: .45; pointer-events: none; }

  /* ---- 精选页的卡片 ---- */
  .f-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
  .f-card.bundle { grid-column: 1 / -1; }
  .f-card .cs-card-title { justify-content: space-between; }
  .f-card .f-name { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f-card .f-desc { color: var(--secondary); font-size: 12px; line-height: 1.6; flex: 1; margin-bottom: 12px; }
  .f-card .f-foot { display: flex; align-items: center; gap: 8px; }
  .f-card .f-foot button { padding: 5px 12px; }
  .f-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .f-bar > i { display: block; height: 100%; width: 0; background: #4d6bfe; transition: width .15s; }
  .f-bar.busy > i { width: 40%; animation: f-slide 1.1s ease-in-out infinite alternate; }
  @keyframes f-slide { from { margin-left: 0 } to { margin-left: 60% } }
  .tag.ok { color: var(--success); background: transparent; border: 1px solid var(--border); }
  .tag.warn { color: var(--muted); background: transparent; border: 1px solid var(--border); }
</style>
</head>
<body>
  <nav id="nav">
    <div class="nav-title"><span data-i18n="配置中心">配置中心</span></div>
    <button data-pane="plugins" class="active"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 3h3a3 3 0 1 1 6 0h3v7a3 3 0 1 0 0 6v5h-7a3 3 0 1 0-6 0H3v-7a3 3 0 1 0 0-6V3h5Z" transform="translate(1 1) scale(.9)"/></svg></span><span data-i18n="插件">插件</span></button>
    <button data-pane="featured"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/></svg></span><span data-i18n="精选">精选</span></button>
    <button data-pane="general"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h6m4 0h6M4 12h10m4 0h2M4 18h2m4 0h10"/><circle cx="12" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></span><span data-i18n="通用">通用</span></button>
    <button data-pane="proxy"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg></span><span data-i18n="代理">代理</span></button>
  </nav>

  <div id="content">

  <!-- ============ 插件 ============ -->
  <div class="pane single active" id="pane-plugins">
    <h2><span data-i18n="插件">插件</span></h2>
    <p class="sub"><span data-i18n="安装后重启生效。构建脚本审批在「插件 → 打开命令行窗口」中完成。">安装后重启生效。构建脚本审批在「插件 → 打开命令行窗口」中完成。</span></p>
    <div class="row" style="margin-bottom:8px">
      <input id="spec" placeholder="some-dsh-plugin@1.2.0 或 github:owner/repo" data-i18n-placeholder="some-dsh-plugin@1.2.0 或 github:owner/repo" spellcheck="false">
      <button id="add" class="primary" style="flex:none"><span data-i18n="安装">安装</span></button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <span class="meta"><span data-i18n="本地插件：">本地插件：</span></span>
      <button id="add-dir" class="ghost"><span data-i18n="从目录安装（开发）">从目录安装（开发）</span></button>
      <button id="add-tgz" class="ghost"><span data-i18n="从 .tgz 安装">从 .tgz 安装</span></button>
    </div>
    <div class="card" id="installed" style="margin-bottom:12px"><span data-i18n="加载中…">加载中…</span></div>
    <div class="msg" id="plugin-status" role="status"></div>
    <details id="plugin-details" hidden>
      <summary data-i18n="诊断详情">诊断详情</summary>
      <div class="log" id="log"></div>
    </details>
    <div class="row" style="margin-top:10px; display:none" id="restart-plugins">
      <span class="spacer"></span><button class="primary" onclick="pluginApi.restart()"><span data-i18n="重启应用生效">重启应用生效</span></button>
    </div>
  </div>

  <!-- ============ 精选 ============ -->
  <div class="pane single" id="pane-featured">
    <h2><span data-i18n="精选插件">精选插件</span></h2>
    <p class="sub"><span data-i18n="dsh-toolkit 全家桶与各子包。按当前内核版本匹配 GitHub Release，下载校验后安装；全家桶与子包二选一，安装后重启生效。">dsh-toolkit 全家桶与各子包。按当前内核版本匹配 GitHub Release，下载校验后安装；全家桶与子包二选一，安装后重启生效。</span></p>
    <div class="row" style="margin-bottom:12px">
      <span class="meta" id="f-summary"></span>
      <span class="spacer"></span>
      <button class="ghost" id="f-releases"><span data-i18n="Release 页面">Release 页面</span></button>
      <button id="f-refresh"><span data-i18n="刷新">刷新</span></button>
    </div>
    <div class="f-grid" id="f-cards"></div>
    <div class="msg" id="f-msg" role="status"></div>
    <details id="f-details" hidden>
      <summary data-i18n="诊断详情">诊断详情</summary>
      <div class="log" id="f-log"></div>
    </details>
    <div class="row" style="margin-top:10px; display:none" id="restart-featured">
      <span class="spacer"></span><button class="primary" onclick="pluginApi.restart()"><span data-i18n="重启应用生效">重启应用生效</span></button>
    </div>
  </div>

  <!-- ============ 通用 ============ -->
  <div class="pane single" id="pane-general">
    <h2><span data-i18n="通用">通用</span></h2>
    <div class="cs-card" style="max-width:720px">
      <div class="cs-card-title"><span data-i18n="启动">启动</span></div>
      <div class="g-rows" id="g-rows"></div>
    </div>
    <div class="msg" id="g-msg"></div>
  </div>

  <!-- ============ 代理 ============ -->
  <div class="pane single" id="pane-proxy">
    <h2><span data-i18n="HTTP 代理">HTTP 代理</span></h2>
    <p class="sub"><span data-i18n="模型、插件与 MCP 共用代理，本机地址直连。保存后重启服务。">模型、插件与 MCP 共用代理，本机地址直连。保存后重启服务。</span></p>
    <div class="field">
      <label class="radio-row"><input type="radio" name="p-mode" id="p-mode-none" value="none"><span data-i18n="不使用代理"> 不使用代理</span></label>
      <label class="radio-row"><input type="radio" name="p-mode" id="p-mode-system" value="system"><span data-i18n="使用系统代理"> 使用系统代理</span></label>
      <label class="radio-row"><input type="radio" name="p-mode" id="p-mode-manual" value="manual"><span data-i18n="手动配置"> 手动配置</span></label>
    </div>
    <div id="p-manual">
      <div class="row" style="align-items:flex-end; gap:10px">
        <div class="field" style="flex:1"><label><span data-i18n="主机名">主机名</span></label>
          <input id="p-host" placeholder="127.0.0.1" spellcheck="false"></div>
        <div class="field" style="flex:0 0 110px"><label><span data-i18n="端口">端口</span></label>
          <input id="p-port" placeholder="7890" spellcheck="false"></div>
      </div>
      <div class="field">
        <label class="radio-row"><input type="checkbox" id="p-auth"><span data-i18n="代理身份验证"> 代理身份验证</span></label>
      </div>
      <div id="p-auth-fields" style="padding-left:22px">
        <div class="row" style="align-items:flex-end; gap:10px">
          <div class="field" style="flex:1"><label><span data-i18n="用户名">用户名</span></label>
            <input id="p-login" spellcheck="false" autocomplete="off"></div>
          <div class="field" style="flex:1"><label><span data-i18n="密码">密码</span></label>
            <input id="p-password" type="password" autocomplete="off"></div>
        </div>
        <div class="field">
          <label class="radio-row"><input type="checkbox" id="p-remember" checked><span data-i18n="记住密码"> 记住密码</span></label>
          <div class="meta" style="margin-top:4px"><span data-i18n="勾选后以明文保存在本机；未勾选时仅本次运行有效。">勾选后以明文保存在本机；未勾选时仅本次运行有效。</span></div>
        </div>
      </div>
    </div>
    <div id="p-bypass-box">
      <div class="field"><label><span data-i18n="不代理的主机（逗号分隔，可选）">不代理的主机（逗号分隔，可选）</span></label>
        <input id="p-bypass" placeholder="*.example.internal, 10.*, &lt;local&gt;" spellcheck="false">
        <div class="meta" style="margin-top:4px"><span data-i18n="支持域名、通配符和 &lt;local&gt;（不含点的主机名）。系统模式下与系统例外列表合并。">支持域名、通配符和 &lt;local&gt;（不含点的主机名）。系统模式下与系统例外列表合并。</span></div></div>
    </div>
    <div id="p-tls">
      <div class="field" style="margin-top:4px"><label><span data-i18n="自定义 CA 证书（PEM，可选）">自定义 CA 证书（PEM，可选）</span></label>
        <div class="row"><input id="p-ca" placeholder="系统证书库" data-i18n-placeholder="系统证书库" spellcheck="false"><button id="p-ca-pick" style="flex:none"><span data-i18n="选择…">选择…</span></button></div></div>
      <div class="field">
        <label class="radio-row"><input type="checkbox" id="p-insecure"><span data-i18n="不校验 TLS 证书（不安全）"> 不校验 TLS 证书（不安全）</span></label>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <span class="spacer"></span>
      <input id="p-test-url" placeholder="https://registry.npmjs.org/-/ping" spellcheck="false" style="flex:1 1 260px">
      <button id="p-test"><span data-i18n="测试连通">测试连通</span></button>
      <button class="primary" id="p-save"><span data-i18n="保存">保存</span></button>
    </div>
    <div class="msg" id="proxy-msg"></div>
  </div>

  </div>

<script src="desktop-i18n.js"></script>
<script>
  const t = (key, ...values) => desktopI18n.translate(key, document.documentElement.lang, ...values)
  document.documentElement.lang = window.desktopLocale?.get() || 'zh'
  const $ = (id) => document.getElementById(id)
  const log = (t) => { $('plugin-details').hidden = false; $('log').textContent += t + '\n'; $('log').scrollTop = 1e9 }
  let busy = false
  let pluginStatus = { key: '', values: [], kind: '' }
  function showPluginStatus(key, kind = '', ...values) {
    pluginStatus = { key, values, kind }
    renderPluginStatus()
  }
  function renderPluginStatus() {
    $('plugin-status').textContent = t(pluginStatus.key, ...pluginStatus.values)
    $('plugin-status').className = 'msg ' + pluginStatus.kind
  }

  // ---- nav ----
  for (const b of document.querySelectorAll('#nav button')) {
    b.onclick = () => {
      document.querySelectorAll('#nav button').forEach((x) => x.classList.remove('active'))
      document.querySelectorAll('.pane').forEach((x) => x.classList.remove('active'))
      b.classList.add('active')
      $('pane-' + b.dataset.pane).classList.add('active')
      if (b.dataset.pane === 'featured' && fCatalog === null) refreshFeatured(false)
    }
  }

  // ================= 插件 =================
  async function refreshPlugins() {
    const { deps, bundles } = await pluginApi.list()
    const names = Object.keys(deps)
    const box = $('installed')
    if (names.length === 0) { box.textContent = t("尚未安装插件"); return }
    box.innerHTML = ''
    for (const name of names) {
      const div = document.createElement('div'); div.className = 'item-row'
      const label = document.createElement('span'); label.className = 'grow'; label.textContent = name
      const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = deps[name]
      div.appendChild(label)
      if (bundles.includes(name)) {
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = t("自动挂载")
        div.appendChild(tag)
      }
      div.appendChild(meta)
      const rm = document.createElement('button'); rm.className = 'danger'; rm.style.padding = '3px 10px'
      rm.textContent = t("移除"); rm.onclick = () => runPlugin('remove', name)
      div.appendChild(rm)
      box.appendChild(div)
    }
  }
  function setPluginBusy(v) {
    busy = v
    if (v) showPluginStatus("处理中…")
    for (const id of ['add', 'add-dir', 'add-tgz']) $(id).disabled = v
  }
  function logResult(res) {
    const needsApproval = res.code !== 0 && res.needsAllowBuilds?.length > 0
    if (needsApproval) showPluginStatus("该插件需要构建脚本审批。", 'err')
    else if (res.code === 0) showPluginStatus("完成", 'ok')
    else showPluginStatus("失败（exit {0}）", 'err', res.code)
    log((res.output || '').trim()); log(res.code === 0 ? t("完成") : t("失败（exit {0}）", res.code))
    if (res.code === 0) $('restart-plugins').style.display = 'flex'
    if (res.code !== 0 && res.needsAllowBuilds && res.needsAllowBuilds.length > 0) {
      log('')
      log(t("该插件需要构建脚本审批。"))
      log(t("按上方 dsh 的提示编辑 allowBuilds 配置后，在「插件 → 打开命令行窗口」中重新安装。"))
    }
  }
  async function runPlugin(action, spec) {
    if (busy || !spec) return
    setPluginBusy(true)
    log(`> dsh plugin --profile web ${action} ${spec}`)
    logResult(await pluginApi.run(action, spec))
    setPluginBusy(false)
    refreshPlugins()
  }
  async function installLocal(kind) {
    if (busy) return
    setPluginBusy(true)
    const res = await pluginApi.installLocal(kind)
    if (res.canceled) showPluginStatus('')
    if (!res.canceled) {
      log(`> dsh plugin --profile web add ${res.spec || t("（本地插件）")}`)
      logResult(res)
      if (res.code === 0 && kind === 'dir') {
        log(t("目录以软链方式安装，改动代码后重启应用生效；插件自身依赖需先在该目录执行 pnpm install。"))
      }
      refreshPlugins()
    }
    setPluginBusy(false)
  }
  $('add').onclick = () => runPlugin('add', $('spec').value.trim())
  $('add-dir').onclick = () => installLocal('dir')
  $('add-tgz').onclick = () => installLocal('tgz')
  $('spec').addEventListener('keydown', (e) => { if (e.key === 'Enter') runPlugin('add', $('spec').value.trim()) })

  // ================= 精选 =================
  // 目录条目来自主进程（featured.js）；标题与说明按 id 取本地字典。
  const F_META = {
    toolkit: { title: "全家桶 dsh-toolkit", desc: "全部子包合一的集成包：数据库、S3 存储、可观测、浏览器桥、AI 订阅、配置中心、记忆与 API 网关。" },
    rdb: { title: "数据库", desc: "关系数据库工作台：SQLite / PostgreSQL / MySQL / GaussDB，数据表格、结构浏览与 SQL 编辑器，db_* 工具。" },
    s3: { title: "S3 存储", desc: "S3 兼容对象存储浏览器：MinIO / OSS / COS / R2，s3_* 工具。" },
    otel: { title: "可观测", desc: "OpenTelemetry GenAI 导出到 Langfuse 等 OTLP 后端。" },
    browser: { title: "浏览器桥", desc: "通过 Chrome / Firefox 扩展驱动用户标签页的 browser_* 工具。" },
    subscriptions: { title: "AI 订阅", desc: "Codex、ChatGPT、Google Antigravity 与 Grok 订阅模型，Codex 搜索、Grok X 搜索，图像与视频生成。" },
    'config-center': { title: "配置中心插件", desc: "MCP 与技能管理、专属 uv / Python 环境、内置插件常用设置。" },
    memory: { title: "记忆", desc: "分层职业记忆：简历、经验、人工更正与版本历史，memory_* 工具。" },
    gateway: { title: "API 网关", desc: "以 OpenAI Chat / Responses 与 Anthropic Messages 协议对外提供已配置的模型，含 API 密钥与用量统计。" },
    extension: { title: "浏览器扩展", desc: "与浏览器桥配对的 Chrome 扩展，解压到固定目录后以开发者模式加载。" },
  }
  let fCatalog = null
  let fBusy = false
  function fMsg(text, cls) { const m = $('f-msg'); m.textContent = text; m.className = 'msg ' + (cls || '') }
  const fLog = (s) => { $('f-details').hidden = false; $('f-log').textContent += s + '\n'; $('f-log').scrollTop = 1e9 }
  const fEl = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }
  async function refreshFeatured(force) {
    $('f-refresh').disabled = true
    if (!fCatalog) $('f-summary').textContent = t("加载中…")
    try { fCatalog = await pluginApi.featuredCatalog(force) } catch (e) { fCatalog = { kernel: null, error: String(e), packages: [], latest: null, compatible: null } }
    $('f-refresh').disabled = false
    renderFeatured()
  }
  function renderFeatured() {
    const c = fCatalog
    if (!c) return
    let summary = c.kernel ? t("内核 v{0}", c.kernel) : t("内核版本未知")
    if (c.compatible) summary += ' · ' + t("匹配 toolkit v{0}", c.compatible.version)
    else if (c.latest) summary += ' · ' + t("无匹配版本，最新 v{0} 对应内核 v{1}", c.latest.version, c.latest.kernel || '?')
    $('f-summary').textContent = summary
    if (c.error) fMsg(t("获取 Release 信息失败：{0}", c.error), 'err')
    const box = $('f-cards')
    box.innerHTML = ''
    const bundleInstalled = c.packages.some(p => p.kind === 'bundle' && p.installedVersion)
    const moduleInstalled = c.packages.some(p => p.kind === 'module' && p.installedVersion)
    for (const p of c.packages) {
      const meta = F_META[p.id] || { title: p.name, desc: '' }
      const card = fEl('div', 'cs-card f-card' + (p.kind === 'bundle' ? ' bundle' : ''))
      card.dataset.id = p.id
      const title = fEl('div', 'cs-card-title')
      title.append(fEl('span', '', t(meta.title)))
      const foot = fEl('div', 'f-foot')
      const action = (label, cls, handler) => { const b = fEl('button', cls, label); b.disabled = fBusy; b.onclick = handler; return b }
      let tag = null
      if (p.kind === 'file') {
        if (p.asset) foot.append(fEl('span', 'meta', t("v{0}", c.compatible.version)), fEl('span', 'spacer'), action(t("下载"), 'primary', () => downloadFeatured(p.id)))
        else tag = fEl('span', 'tag warn', t("无匹配版本"))
      } else if (p.kind === 'module' && bundleInstalled && !p.installedVersion) {
        tag = fEl('span', 'tag ok', t("已包含在全家桶"))
      } else if (p.state === 'install') {
        const label = p.kind === 'bundle' && moduleInstalled ? t("替换为全家桶") : t("安装")
        foot.append(fEl('span', 'meta', t("v{0}", c.compatible.version)), fEl('span', 'spacer'), action(label, 'primary', () => installFeatured(p.id)))
      } else if (p.state === 'update') {
        tag = fEl('span', 'tag', t("可更新"))
        foot.append(fEl('span', 'meta', t("v{0} → v{1}", p.installedVersion, c.compatible.version)), fEl('span', 'spacer'),
          action(t("移除"), 'danger', () => removeFeatured(p.name)), action(t("更新"), 'primary', () => installFeatured(p.id)))
      } else if (p.state === 'installed') {
        tag = fEl('span', 'tag ok', t("已安装"))
        foot.append(fEl('span', 'meta', t("v{0}", p.installedVersion)), fEl('span', 'spacer'), action(t("移除"), 'danger', () => removeFeatured(p.name)))
      } else {
        tag = fEl('span', 'tag warn', t("无匹配版本"))
        if (p.installedVersion) foot.append(fEl('span', 'meta', t("v{0}", p.installedVersion)), fEl('span', 'spacer'), action(t("移除"), 'danger', () => removeFeatured(p.name)))
      }
      if (tag) title.append(tag)
      const bar = fEl('div', 'f-bar')
      bar.hidden = true
      bar.appendChild(document.createElement('i'))
      card.append(title, fEl('div', 'f-name', p.name), fEl('div', 'f-desc', t(meta.desc)), foot, bar)
      box.appendChild(card)
    }
  }
  function fCard(id) { return document.querySelector(`.f-card[data-id="${id}"]`) }
  function fProgress(p) {
    const card = fCard(p.id)
    if (!card) return
    const bar = card.querySelector('.f-bar')
    const fill = bar.firstElementChild
    if (p.phase === 'done') { bar.hidden = true; bar.classList.remove('busy'); fill.style.width = '0'; return }
    bar.hidden = false
    if (p.phase === 'download') {
      bar.classList.remove('busy')
      fill.style.width = p.total > 0 ? `${Math.min(100, Math.round(p.received / p.total * 100))}%` : '0'
      fMsg(p.total > 0 ? t("正在下载… {0} / {1} MB", (p.received / 1048576).toFixed(1), (p.total / 1048576).toFixed(1)) : t("正在下载…"))
    } else if (p.phase === 'remove') {
      bar.classList.add('busy'); fMsg(t("正在移除 {0}…", p.name))
    } else {
      bar.classList.add('busy'); fMsg(t("正在安装…"))
    }
  }
  pluginApi.onFeaturedProgress(fProgress)
  function fResult(res) {
    const needsApproval = res.code !== 0 && res.needsAllowBuilds && res.needsAllowBuilds.length > 0
    if (needsApproval) fMsg(t("该插件需要构建脚本审批。"), 'err')
    else if (res.code === 0) fMsg(t("完成"), 'ok')
    else fMsg(t("失败（exit {0}）", res.code), 'err')
    fLog((res.output || '').trim())
    fLog(res.code === 0 ? t("完成") : t("失败（exit {0}）", res.code))
    if (needsApproval) { fLog(''); fLog(t("按上方 dsh 的提示编辑 allowBuilds 配置后，在「插件 → 打开命令行窗口」中重新安装。")) }
    if (res.code === 0) $('restart-featured').style.display = 'flex'
  }
  async function fRun(task) {
    if (fBusy) return
    fBusy = true
    renderFeatured()
    try { await task() } finally {
      fBusy = false
      await refreshFeatured(false)
      refreshPlugins()
    }
  }
  const installFeatured = (id) => fRun(async () => { fMsg(t("正在下载…")); fResult(await pluginApi.featuredInstall(id)) })
  const removeFeatured = (name) => fRun(async () => { fMsg(t("处理中…")); fLog(`> dsh plugin --profile web remove ${name}`); fResult(await pluginApi.run('remove', name)) })
  const downloadFeatured = (id) => fRun(async () => {
    const res = await pluginApi.featuredDownload(id)
    if (res.canceled) { fMsg(''); return }
    if (res.code === 0) { fMsg(t("已下载"), 'ok'); fLog(res.output) } else fResult(res)
  })
  $('f-refresh').onclick = () => { fMsg(''); refreshFeatured(true) }
  $('f-releases').onclick = () => pluginApi.featuredOpenRelease(fCatalog && fCatalog.compatible ? 'compatible' : 'all')

  // ================= 通用 =================
  // 五个布尔项，切换即保存并由主进程立即应用（托盘 / 登录项 / 休眠阻止）。
  // needsTray 项在 Windows / Linux 上依赖「显示托盘图标」，托盘关闭时整行变淡。
  const G_ITEMS = [
    { key: 'openAtLogin', label: ("开机自动启动") },
    { key: 'startMinimized', label: ("启动时最小化到托盘"), needsTray: true },
    { key: 'trayIcon', label: ("显示托盘图标") },
    { key: 'closeToTray', label: ("关闭时最小化到托盘"), needsTray: true },
    { key: 'keepAwake', label: ("运行任务时保持系统唤醒") },
  ]
  let gState = {}
  let gPlatform = ''
  function gMsg(text, cls) { const m = $('g-msg'); m.textContent = text; m.className = 'msg ' + (cls || '') }
  function renderGeneral() {
    const box = $('g-rows')
    box.innerHTML = ''
    for (const it of G_ITEMS) {
      const row = document.createElement('div')
      row.className = 'g-row'
      if (it.needsTray && !gState.trayIcon && gPlatform !== 'darwin') row.classList.add('off')
      const text = document.createElement('div')
      text.className = 'g-text'
      const label = document.createElement('div'); label.className = 'g-label'; label.textContent = t(it.label)
      text.append(label)
      const toggle = document.createElement('label')
      toggle.className = 'toggle'
      const input = document.createElement('input')
      input.type = 'checkbox'
      input.checked = gState[it.key] === true
      input.onchange = async () => {
        const next = { ...gState, [it.key]: input.checked }
        const res = await pluginApi.generalSave(next)
        if (!res.ok) { input.checked = !input.checked; gMsg(res.error || t("保存失败"), 'err'); return }
        gState = res.settings
        gMsg(t("已保存"), 'ok')
        renderGeneral()
      }
      const knob = document.createElement('span'); knob.className = 'knob'
      toggle.append(input, knob)
      row.append(text, toggle)
      box.appendChild(row)
    }
  }
  pluginApi.generalGet().then((r) => { gState = r.settings || {}; gPlatform = r.platform || ''; renderGeneral() }).catch((e) => gMsg(t("加载失败：") + e, 'err'))

  // ================= 代理 =================
  function proxyMsg(text, cls) { const m = $('proxy-msg'); m.textContent = text; m.className = 'msg ' + (cls || '') }
  function proxyDim() {
    $('p-manual').classList.toggle('dim', !$('p-mode-manual').checked)
    $('p-bypass-box').classList.toggle('dim', $('p-mode-none').checked)
    $('p-tls').classList.toggle('dim', $('p-mode-none').checked)
    $('p-auth-fields').classList.toggle('dim', !$('p-auth').checked)
  }
  function readProxyForm() {
    return {
      mode: $('p-mode-manual').checked ? 'manual' : $('p-mode-system').checked ? 'system' : 'none',
      host: $('p-host').value.trim(), port: $('p-port').value.trim(),
      bypass: $('p-bypass').value.trim(),
      auth: $('p-auth').checked, login: $('p-login').value, password: $('p-password').value,
      remember: $('p-remember').checked,
      caPath: $('p-ca').value.trim(), insecure: $('p-insecure').checked,
    }
  }
  pluginApi.proxyGet().then((c) => {
    ;($('p-mode-' + (c.mode === 'manual' || c.mode === 'system' ? c.mode : 'none'))).checked = true
    $('p-host').value = c.host || ''
    $('p-port').value = c.port || ''
    $('p-bypass').value = c.bypass || ''
    $('p-auth').checked = !!c.auth
    $('p-login').value = c.login || ''
    $('p-password').value = c.password || ''
    $('p-remember').checked = c.remember !== false
    $('p-ca').value = c.caPath || ''
    $('p-insecure').checked = !!c.insecure
    proxyDim()
  })
  $('p-ca-pick').onclick = async () => {
    const r = await pluginApi.proxyPickCa()
    if (!r.canceled && r.path) $('p-ca').value = r.path
  }
  for (const id of ['p-mode-none', 'p-mode-system', 'p-mode-manual', 'p-auth']) $(id).onchange = proxyDim
  function validateProxyForm(c) {
    if (c.mode !== 'manual') return null
    if (!/^[\w.-]+$/.test(c.host)) return t("主机名无效")
    if (!/^\d{1,5}$/.test(c.port) || +c.port < 1 || +c.port > 65535) return t("端口需为 1-65535")
    return null
  }
  $('p-save').onclick = async () => {
    const c = readProxyForm()
    const err = validateProxyForm(c)
    if (err) { proxyMsg(err, 'err'); return }
    $('p-save').disabled = true
    const res = await pluginApi.proxySave(c)
    if (!res.ok) { proxyMsg(t("保存失败：") + res.error, 'err'); $('p-save').disabled = false; return }
    proxyMsg(t("已保存，正在重启 dsh 服务…"))
    const r = await pluginApi.serverRestart()
    $('p-save').disabled = false
    if (r.ok) proxyMsg(t("已保存"), 'ok')
    else proxyMsg(t("已保存，服务重启失败：") + r.error + t("\n重启应用后生效。"), 'err')
  }
  $('p-test').onclick = async () => {
    const c = readProxyForm()
    if (c.mode === 'manual') {
      const err = validateProxyForm(c)
      if (err) { proxyMsg(t("请先填写主机名和端口"), 'err'); return }
    }
    $('p-test').disabled = true
    proxyMsg(t("测试中…"))
    const res = await pluginApi.proxyTest(c, $('p-test-url').value.trim())
    proxyMsg(res.detail, res.ok ? 'ok' : 'err')
    $('p-test').disabled = false
  }

  // ---- init ----
  refreshPlugins()

  function translateStatic() {
    for(const el of document.querySelectorAll('[data-i18n]')) el.textContent=t(el.dataset.i18n)
    for(const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder=t(el.dataset.i18nPlaceholder)
    renderPluginStatus()
  }
  translateStatic()
  window.addEventListener('desktop-language-change', () => { translateStatic(); renderGeneral(); refreshPlugins(); renderFeatured() })
</script>
</body>
</html>
